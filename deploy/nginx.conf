server {
    listen 80;
    server_name messenger.wrzdx.tech;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/messenger-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name messenger.wrzdx.tech;
    ssl_certificate /etc/letsencrypt/live/messenger.wrzdx.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/messenger.wrzdx.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;
    access_log /var/log/nginx/messenger.access.log;
    error_log /var/log/nginx/messenger.error.log;

    location /api/v1/ws {
        proxy_pass http://127.0.0.1:5051;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 20m;
        proxy_send_timeout 20m;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:5051;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
